name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    uses: ./.github/workflows/setup-builds.yml

  test:
    # The installer, the fake Discord install and the browser paths are all Windows-specific
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache bun and Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --cli
      - run: bunx tsc --noEmit
      - run: bun test

      - name: Fast Lists plugin
        timeout-minutes: 5
        run: node scripts/test-fast-lists.ts

      - name: Web (live discord.com)
        timeout-minutes: 10
        run: node scripts/test-web.ts

      - name: Electron (live discord.com)
        timeout-minutes: 10
        run: bun scripts/test-electron.ts

      - name: CLI
        timeout-minutes: 5
        run: bun scripts/test-cli.ts

      - name: CLI (compiled exe)
        timeout-minutes: 5
        run: bun scripts/test-cli.ts --exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          # Screenshots and logs; the fake Discord installs are two copies of Electron, not worth keeping
          path: |
            test-results/
            !test-results/electron/fake-discord/
          if-no-files-found: ignore
