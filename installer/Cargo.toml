[package]
name = "evi-setup"
# The version users see comes from ../package.json
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true }
serde_json = "1"

[dependencies]
# custom-protocol: the UI is always served from the embedded ui/ folder, so a plain `cargo build --release` works
tauri = { version = "2", features = ["custom-protocol"], optional = true }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# System certificate verification with rustls, without an OpenSSL dependency
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
