# Builds Evi Setup for Windows, macOS and Linux and evi-core.json (what Evi Setup and in-app updates
# download), tests them and publishes the release. Releases carry no evi CLI since 1.5.0: Evi 1.4.0
# and later update from evi-core.json alone. Evi Setup builds on each system (setup-builds.yml),
# alongside the job that tests Evi and builds evi-core.json; the release is published once every
# build and test passed.
# Its notes come from the version's entry in src/shared/changelog.ts (scripts/release-notes.ts), so
# there's nothing to write or press on GitHub. Evi's Updates tab, `evi update`, Evi Setup and
# evi.rest's releases and download pages all pick it up from there by themselves.
#
# A version with a dash (v0.5.0-beta.1) is published as a prerelease that never becomes "Latest":
# only people who turned on beta versions (or run `evi update --beta`) get it.
#
# Run it from the Actions tab with a version, or push a tag: git tag v0.2.0 && git push origin v0.2.0
# Either way the version has to match package.json, since that's what the exe reports, and have an
# entry in src/shared/changelog.ts: the run stops before building without one.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match package.json)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  setup:
    uses: ./.github/workflows/setup-builds.yml

  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$version\" isn't a version like 1.2.3"
            exit 1
          fi
          pkg_version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::package.json says $pkg_version but this release is $version. Bump package.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The release's notes, from its entry in src/shared/changelog.ts: fails right away without one
      - run: bun scripts/release-notes.ts "${{ steps.version.outputs.version }}" > notes.md && cat notes.md

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun scripts/test-cli.ts

      # evi-core.json with its .sha256
      - run: bun scripts/build.ts --release
      - run: cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/evi-core.json
            dist/evi-core.json.sha256
            notes.md
          if-no-files-found: error

  # Published straight away: everything in both jobs built and tested what's uploaded
  publish:
    needs: [release, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release or draft for $TAG already exists. Delete it first to rebuild."
            exit 1
          fi
          flags=(--latest)
          if [[ "$VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          cd out
          # The Windows job's files arrive in dist/ (its upload kept the folder next to notes.md)
          if [ -d dist ]; then mv dist/* . && rmdir dist; fi
          ls -l
          # Evi Setup for every system, and evi-core.json for Evi Setup and in-app updates
          gh release create "$TAG" evi-core.json             Evi-Setup.exe Evi-Setup-macos.zip Evi-Setup-linux-{x64,arm64} *.sha256             "${flags[@]}"             --target "$GITHUB_SHA"             --title "Evi $VERSION"             --notes-file notes.md
