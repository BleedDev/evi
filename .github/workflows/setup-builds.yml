# Shared by CI and releases: native Setup builds, each with its checksum.
# Tags restore main's Rust caches; saving tag-only caches would not help later releases.
name: Evi Setup

on:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The installer test checks that Setup lays down this build's Evi (dist/embed.json)
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo test --locked --manifest-path installer/Cargo.toml
      - run: bun scripts/build.ts --installer
      - run: bun scripts/test-installer.ts

      - uses: actions/upload-artifact@v7
        with:
          name: setup-windows
          path: dist/Evi-Setup.exe*

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test --locked --manifest-path installer/Cargo.toml
      - run: bun scripts/build.ts --installer

      # What people get: unzipped as Safari or Finder would, both processors in it, the signature intact
      - name: Check the app
        run: |
          ditto -x -k dist/Evi-Setup-macos.zip "$RUNNER_TEMP/unzipped"
          app="$RUNNER_TEMP/unzipped/Evi Setup.app"
          lipo "$app/Contents/MacOS/evi-setup" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/evi-setup" status --json | grep '"installs"'

      - uses: actions/upload-artifact@v7
        with:
          name: setup-macos
          path: dist/Evi-Setup-macos.zip*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: System libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          install() {
            timeout 90 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
            timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev pkg-config build-essential
          }
          install || {
            echo "::warning::apt stalled, trying again on archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            install
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit tests
        working-directory: installer
        run: |
          cargo test --locked
          cargo test --locked --no-default-features

      - name: Build
        run: |
          bun scripts/build.ts --installer
          bun scripts/build.ts --installer-cli

      - name: Check the app
        run: |
          dist/Evi-Setup-linux-${{ matrix.arch }} status --json | grep '"installs"'
          dist/Evi-Setup-linux-cli-${{ matrix.arch }} status --json | grep '"installs"'
          ! readelf -d dist/Evi-Setup-linux-cli-${{ matrix.arch }} | grep -Ei 'NEEDED.*lib(gtk|webkit|ssl|crypto)'

      - uses: actions/upload-artifact@v7
        with:
          name: setup-linux-${{ matrix.arch }}
          path: dist/Evi-Setup-linux-*
