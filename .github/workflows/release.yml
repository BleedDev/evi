name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match package.json)"
        required: true
      rebuild_setup:
        description: "Build Evi Setup again even if installer/ is unchanged"
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      reused: ${{ steps.setup.outputs.reused }}
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::A release or draft for v$version already exists"
            exit 1
          fi
          mkdir out
          bun scripts/release-notes.ts "$version" > out/notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --release
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun scripts/test-cli.ts
      - run: cp dist/evi-core.json* out/

      - name: Evi Setup from the last release
        id: setup
        run: |
          reused=false
          last=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ "${{ inputs.rebuild_setup }}" != "true" ] && [ -n "$last" ] &&
             git fetch -q --depth=1 origin "refs/tags/$last:refs/tags/$last" &&
             git diff --quiet "$last" HEAD -- installer .github/workflows/setup-builds.yml &&
             gh release download "$last" -p "Evi-Setup*" -D setup &&
             (cd setup && sha256sum -c Evi-Setup.exe.sha256 Evi-Setup-macos.zip.sha256 Evi-Setup-linux-{x64,arm64}.sha256 Evi-Setup-linux-cli-{x64,arm64}.sha256); then
            mv setup/* out/
            reused=true
          fi
          rm -rf setup
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: out/

  setup:
    needs: release
    if: needs.release.outputs.reused != 'true'
    uses: ./.github/workflows/setup-builds.yml

  publish:
    needs: [release, setup]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          flags=(--latest)
          if [[ "$VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "v$VERSION" evi-core.json evi-core.json.gz Evi-Setup.exe Evi-Setup-macos.zip Evi-Setup-linux-{x64,arm64} Evi-Setup-linux-cli-{x64,arm64} *.sha256 \
            "${flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "Evi $VERSION" \
            --notes-file notes.md
